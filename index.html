<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="jeTn4wcapMELYB0_EwelZmAoGnW9QSTZW59s32w6AQE" />
    <title>NextChain Store - 智能商品展示</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="gradient-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold">NextChain Store</h1>
                </div>
                <div class="flex space-x-6">
                    <a href="#" class="hover:text-blue-200">首页</a>
                    <a href="#products" class="hover:text-blue-200">商品</a>
                    <a href="#about" class="hover:text-blue-200">关于</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="gradient-bg text-white py-20">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold mb-4">智能商品推荐</h2>
            <p class="text-xl opacity-90">AI 驱动的个性化购物体验</p>
        </div>
    </div>

    <div id="products" class="max-w-7xl mx-auto px-4 py-12">
        <h3 class="text-2xl font-bold text-gray-900 mb-8">热门商品</h3>
        
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        </div>
    </div>

    <footer class="bg-gray-900 text-gray-400 py-8 mt-16">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>© 2024 NextChain Store. GMC Merchant ID: 5715277387</p>
        </div>
    </footer>

    <script>
        const products = [
            { id: '001', name: '戴森 Dyson HD15 新一代吹风机', price: 3199, image: 'https://via.placeholder.com/300x300/667eea/ffffff?text=Dyson', brand: '戴森', feature: '智能温控 | 防飞翘风嘴' },
            { id: '002', name: '徕芬 Laifen LF03 高速吹风机', price: 599, image: 'https://via.placeholder.com/300x300/764ba2/ffffff?text=Laifen', brand: '徕芬', feature: '11万转马达 | 2亿负离子
            { id: '003', name: '小米 米家高速吹风机 H501', price: 279, image: 'https://via.placeholder.com/300x300/f59e0b/ffffff?text=Xiaomi', brand: '小米', feature: '62m/s风速 | 温控监测' },
            { id: '004', name: '飞科 FH6232 大功率电吹风', price: 59, image: 'https://via.placeholder.com/300x300/10b981/ffffff?text=Flyco', brand: '飞科', feature: '2000W大功率 | 热量均衡' }
        ];

        function renderProducts() {
            const container = document.getElementById('product-list');
            container.innerHTML = products.map(p => `
                <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-xl transition-shadow">
                    <img src="${p.image}" alt="${p.name}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <div class="text-xs text-blue-600 mb-1">${p.brand}</div>
                        <h4 class="font-semibold text-gray-900 mb-2 line-clamp-2">${p.name}</h4>
                        <p class="text-xs text-gray-500 mb-3">${p.feature}</p>
                        <div class="flex items-center justify-between">
                            <span class="text-xl font-bold text-red-600">¥${p.price}</span>
                            <button class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">查看详情</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        renderProducts();
    </script>
</body>
</html>
